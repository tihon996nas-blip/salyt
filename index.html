<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jazz Morning</title>
  <style>
    :root {
      --btn-size: clamp(64px, 20vw, 88px);
      --accent:   oklch(68% 0.16 245);
      --accent-h: oklch(60% 0.16 245);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d0d0f;
    }

    /* ── Video background ── */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Subtle dark overlay so button stays readable ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: oklch(0% 0 0 / 0.32);
      z-index: 1;
      pointer-events: none;
    }

    /* ── Player ── */
    .player {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .btn-play {
      width: var(--btn-size);
      height: var(--btn-size);
      border-radius: 50%;
      border: none;
      background: oklch(100% 0 0 / 0.18);
      backdrop-filter: blur(12px) saturate(1.4);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 140ms ease, transform 100ms ease;
      outline: none;
      flex-shrink: 0;
    }
    .btn-play:hover  { background: oklch(100% 0 0 / 0.28); }
    .btn-play:active { transform: scale(0.91); }
    .btn-play:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }
    .btn-play svg {
      width: 42%;
      height: 42%;
      fill: #fff;
      pointer-events: none;
    }

    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(11px, 3.2vw, 13px);
      color: oklch(92% 0.02 240 / 0.85);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      text-shadow: 0 1px 4px oklch(0% 0 0 / 0.5);
    }
  </style>
</head>
<body>

<!-- Background video -->
<video
  class="bg-video"
  id="bgvideo"
  src="video.mp4"
  loop
  muted
  playsinline
  preload="auto"
></video>

<div class="overlay"></div>

<div class="player">
  <button class="btn-play" id="btn" aria-label="Play" onclick="toggle()">
    <svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="ico-stop" viewBox="0 0 24 24" style="display:none"><path d="M6 6h12v12H6z"/></svg>
  </button>
  <span class="label" id="lbl" aria-live="polite">Jazz Morning</span>
</div>

<audio id="audio" src="jazz.mp3" preload="auto"></audio>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

const audio  = document.getElementById('audio');
const bgvid  = document.getElementById('bgvideo');
const btn    = document.getElementById('btn');
const iPlay  = document.getElementById('ico-play');
const iStop  = document.getElementById('ico-stop');
const lbl    = document.getElementById('lbl');

function setPlaying(on) {
  iPlay.style.display = on ? 'none'  : 'block';
  iStop.style.display = on ? 'block' : 'none';
  btn.setAttribute('aria-label', on ? 'Stop' : 'Play');
  lbl.textContent = on ? '\u25aa Playing' : 'Jazz Morning';

  if (on) {
    bgvid.play().catch(() => {});
  } else {
    bgvid.pause();
  }
}

audio.addEventListener('ended', () => setPlaying(false));

function toggle() {
  if (audio.paused) {
    audio.play()
      .then(() => setPlaying(true))
      .catch(() => { lbl.textContent = 'Tap to play'; });
  } else {
    audio.pause();
    setPlaying(false);
  }
}

// Auto-play on load
window.addEventListener('load', () => {
  audio.play()
    .then(() => setPlaying(true))
    .catch(() => { lbl.textContent = 'Tap to play'; });
});
</script>
</body>
</html>
