<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Салют — Jazz Morning</title>
  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --text:      #f0f2f8;
      --muted:     #8b90a8;
      --accent:    oklch(62% 0.18 245);
      --accent-hv: oklch(55% 0.18 245);
      --radius-sm: 12px;
      --radius-lg: 24px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 28px;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .icon {
      width: 72px;
      height: 72px;
      opacity: 0.85;
    }

    .track-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-align: center;
    }

    .track-meta {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.25s linear;
    }

    .progress-times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Play button */
    .btn-play {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 120ms ease, transform 120ms ease;
      outline: none;
    }

    .btn-play:hover  { background: var(--accent-hv); }
    .btn-play:active { transform: scale(0.92); }

    .btn-play:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .btn-play svg {
      width: 26px;
      height: 26px;
      fill: #fff;
      pointer-events: none;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card" role="region" aria-label="Музыкальный плеер">

  <!-- Иконка колонки (inline SVG, не требует внешних файлов) -->
  <svg class="icon" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="16" y="8" width="40" height="56" rx="8" fill="#1e2235" stroke="#3a3f58" stroke-width="1.5"/>
    <circle cx="36" cy="44" r="12" fill="#2a2f48" stroke="#3a3f58" stroke-width="1.5"/>
    <circle cx="36" cy="44" r="5"  fill="#5b7ef5" opacity="0.9"/>
    <rect x="28" y="16" width="16" height="10" rx="4" fill="#5b7ef5" opacity="0.7"/>
    <circle cx="36" cy="44" r="2"  fill="#fff" opacity="0.6"/>
  </svg>

  <div>
    <div class="track-name" id="trackName">Jazz Morning</div>
    <div class="track-meta" id="trackMeta">Салют выбрал для тебя</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" role="progressbar" aria-label="Прогресс воспроизведения"
         aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-times">
      <span id="timeElapsed">0:00</span>
      <span id="timeDuration">—</span>
    </div>
  </div>

  <button class="btn-play" id="btnPlay" aria-label="Воспроизвести" onclick="togglePlay()">
    <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="iconStop" viewBox="0 0 24 24" style="display:none"><path d="M6 6h12v12H6z"/></svg>
  </button>

  <div class="status" id="status" aria-live="polite">Нажми чтобы послушать</div>
</div>

<audio id="audio" src="jazz.mp3" preload="metadata"></audio>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const audio       = document.getElementById('audio');
  const btnPlay     = document.getElementById('btnPlay');
  const iconPlay    = document.getElementById('iconPlay');
  const iconStop    = document.getElementById('iconStop');
  const progressFill = document.getElementById('progressFill');
  const progressBar  = document.getElementById('progressBar');
  const timeElapsed  = document.getElementById('timeElapsed');
  const timeDuration = document.getElementById('timeDuration');
  const status       = document.getElementById('status');

  // Telegram WebApp init
  if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  function fmt(s) {
    if (!isFinite(s)) return '—';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  audio.addEventListener('loadedmetadata', () => {
    timeDuration.textContent = fmt(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    progressBar.setAttribute('aria-valuenow', Math.round(pct));
    timeElapsed.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    setStoppedState();
    audio.currentTime = 0;
  });

  function setPlayingState() {
    iconPlay.style.display = 'none';
    iconStop.style.display = 'block';
    btnPlay.setAttribute('aria-label', 'Остановить');
    status.textContent = 'Играет ♪';
  }

  function setStoppedState() {
    iconPlay.style.display = 'block';
    iconStop.style.display = 'none';
    btnPlay.setAttribute('aria-label', 'Воспроизвести');
    status.textContent = 'Тишина тоже ничего.';
  }

  function togglePlay() {
    if (audio.paused) {
      audio.play().then(setPlayingState).catch(() => {
        status.textContent = 'Не удалось загрузить аудио';
      });
    } else {
      audio.pause();
      setStoppedState();
    }
  }

  // Перемотка по клику на прогресс-бар
  progressBar.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audio.currentTime = ratio * audio.duration;
  });
</script>
</body>
</html>
